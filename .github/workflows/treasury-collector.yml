name: Treasury collector

on:
  workflow_dispatch:
  schedule:
    # UTC. Run away from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: treasury-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Collect Treasury auctions and ingest into Cloudflare D1
        env:
          TREASURY_INGEST_URL: https://us-funding-dashboard.nb2sy.workers.dev/api/treasury-ingest
          TREASURY_INGEST_TOKEN: ${{ secrets.TREASURY_INGEST_TOKEN }}
        run: python scripts/treasury_collector.py
